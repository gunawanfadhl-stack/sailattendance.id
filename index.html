<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Association of International Law</title>
<style>
:root{
  --bg:#f6f6f3; --panel:#ffffff; --ink:#13273c; --sub:#5c6c7c;
  --line:#e3e1d9; --accent:#13273c; --accent-ink:#ffffff;
  --gold:#bf9a3f; --navy:#13273c;
  --ok:#2f7a45; --bad:#a13d3d; --warn:#a97b1f;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12181f; --panel:#1a222b; --ink:#eee; --sub:#9aa6b0; --line:#2b333d;
  }
}
:root[data-theme="dark"]{
  --bg:#12181f; --panel:#1a222b; --ink:#eee; --sub:#9aa6b0; --line:#2b333d;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
header{
  position:sticky; top:0; padding:14px 16px calc(14px + env(safe-area-inset-top,0px));
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:var(--navy); border-bottom:1px solid var(--line); z-index:10;
}
.brand{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.brand img{width:34px; height:34px; border-radius:50%; flex:none; object-fit:cover;}
h1{font-size:16px; margin:0; color:var(--gold); line-height:1.25;}
.tabs{display:flex; gap:6px; overflow-x:auto;}
.tab{
  flex:none; padding:7px 12px; border-radius:20px; border:1px solid var(--gold);
  background:transparent; color:var(--gold); font-size:13px; cursor:pointer; white-space:nowrap;
  opacity:.8;
}
.tab.active{background:var(--gold); color:var(--navy); border-color:var(--gold); opacity:1; font-weight:600;}
main{max-width:820px; margin:0 auto; padding:16px;}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:14px;}
.card h2{font-size:13px; margin:0 0 10px; color:var(--ink); text-transform:uppercase; letter-spacing:.06em; font-weight:700; border-bottom:2px solid var(--gold); padding-bottom:6px; display:inline-block;}
.card{box-shadow:0 1px 3px rgba(0,0,0,.05);}
.row{display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
input,select{
  background:var(--bg); border:1px solid var(--line); color:var(--ink);
  padding:8px 10px; border-radius:8px; font-size:14px; flex:1; min-width:120px;
}
button{
  background:var(--accent); color:var(--accent-ink); border:none; border-radius:8px;
  padding:8px 12px; font-size:13px; cursor:pointer;
}
button.ghost{background:transparent; color:var(--bad); border:1px solid var(--line); padding:5px 8px; font-size:12px;}
table{width:100%; border-collapse:collapse; font-size:13px;}
th,td{padding:7px 6px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap;}
.overflow{overflow-x:auto;}
.status-btn{padding:4px 8px; font-size:12px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--sub); cursor:pointer; margin-right:3px;}
.status-btn.present{background:var(--ok); color:#fff; border-color:var(--ok);}
.status-btn.absent{background:var(--bad); color:#fff; border-color:var(--bad);}
.status-btn.excused{background:var(--warn); color:#fff; border-color:var(--warn);}
.pct{font-weight:600;}
.pct.low{color:var(--bad);}
.pct.mid{color:var(--warn);}
.pct.high{color:var(--ok);}
.muted{color:var(--sub); font-size:12px;}
.empty{color:var(--sub); font-size:13px; padding:8px 0;}
.role-tag{font-size:11px; padding:2px 6px; border-radius:5px; background:var(--bg); border:1px solid var(--line); color:var(--sub);}
.bar-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.bar-label{width:110px; font-size:12px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bar-track{flex:1; background:var(--bg); border-radius:5px; height:16px; overflow:hidden; border:1px solid var(--line);}
.bar-fill{height:100%; border-radius:5px 0 0 5px;}
.bar-val{width:38px; flex:none; font-size:12px; text-align:right;}
</style>
</head>

    <h1>Student Association of International Law</h1>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>

<script>
const DIVISIONS = ["Competition","HR","Study & Discussion","Media & Communication"];
let state = { division: DIVISIONS[0], members: [], events: [], attendance: [] };
let db = null;
let unsubs = [];

function pctClass(p){ return p>=80?'high':p>=50?'mid':'low'; }

function render(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = DIVISIONS.map(d =>
    `<div class="tab ${d===state.division?'active':''}" data-d="${d}">${d}</div>`
  ).join('');
  tabs.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ state.division=t.dataset.d; render(); });

  const div = state.division;
  const members = state.members.filter(m=>m.division===div);
  const events = state.events.filter(e=>e.division===div).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const att = state.attendance.filter(a=>a.division===div);

  const attMap = {};
  att.forEach(a=>{ attMap[a.eventId+'_'+a.memberId] = a.status; });

  // stats
  const stats = members.map(m=>{
    const rows = att.filter(a=>a.memberId===m.id);
    const present = rows.filter(a=>a.status==='present').length;
    const total = events.length;
    const pct = total>0 ? Math.round((present/total)*100) : 0;
    return {...m, present, total, pct};
  });

  // cross-division comparison (uses full state, not just current tab)
  const divStats = DIVISIONS.map(d=>{
    const dMembers = state.members.filter(m=>m.division===d);
    const dEvents = state.events.filter(e=>e.division===d);
    const dAtt = state.attendance.filter(a=>a.division===d);
    if(!dMembers.length || !dEvents.length) return { division: d, pct: 0, hasData:false };
    const rates = dMembers.map(m=>{
      const present = dAtt.filter(a=>a.memberId===m.id && a.status==='present').length;
      return dEvents.length>0 ? (present/dEvents.length)*100 : 0;
    });
    const avg = Math.round(rates.reduce((a,b)=>a+b,0)/rates.length);
    return { division: d, pct: avg, hasData:true };
  });

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="card">
      <h2>Division Comparison — Avg. Attendance Rate</h2>
      ${divStats.map(s=>`
        <div class="bar-row">
          <div class="bar-label" title="${esc(s.division)}">${esc(s.division)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${s.pct}%; background:${s.pct>=80?'var(--ok)':s.pct>=50?'var(--warn)':'var(--bad)'};"></div></div>
          <div class="bar-val">${s.hasData? s.pct+'%' : '—'}</div>
        </div>
      `).join('')}
      <div class="muted" style="margin-top:6px;">Based on members and events entered so far in each division.</div>
    </div>

    <div class="card">
      <h2>Members — ${div}</h2>
      <div class="row">
        <input id="mName" placeholder="Member name">
        <select id="mRole"><option value="Member">Member</option><option value="Staff">Staff</option></select>
        <button onclick="addMember()">Add</button>
      </div>
      ${members.length? `<div class="overflow"><table><tbody>
        ${members.map(m=>`<tr><td>${esc(m.name)}</td><td><span class="role-tag">${esc(m.role||'Member')}</span></td><td style="text-align:right"><button class="ghost" onclick="removeMember('${m.id}')">Remove</button></td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">No members yet.</div>'}
    </div>

    <div class="card">
      <h2>Events — ${div}</h2>
      <div class="row">
        <input id="eName" placeholder="Event / meeting name">
        <input id="eDate" type="date">
        <button onclick="addEvent()">Add</button>
      </div>
      ${events.length? `<div class="overflow"><table><tbody>
        ${events.map(e=>`<tr><td>${esc(e.title)}</td><td class="muted">${e.date||''}</td><td style="text-align:right"><button class="ghost" onclick="removeEvent('${e.id}')">Remove</button></td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">No events yet.</div>'}
    </div>

    <div class="card">
      <h2>Attendance Grid</h2>
      ${(!members.length || !events.length) ? '<div class="empty">Add members and events to start tracking.</div>' :
      `<div class="overflow"><table>
        <thead><tr><th>Member</th>${events.map(e=>`<th>${esc(e.title)}</th>`).join('')}</tr></thead>
        <tbody>
        ${members.map(m=>`<tr><td>${esc(m.name)}</td>${events.map(e=>{
          const key = e.id+'_'+m.id;
          const cur = attMap[key] || '';
          return `<td>
            <button class="status-btn ${cur==='present'?'present':''}" onclick="setStatus('${e.id}','${m.id}','present')">P</button>
            <button class="status-btn ${cur==='absent'?'absent':''}" onclick="setStatus('${e.id}','${m.id}','absent')">A</button>
            <button class="status-btn ${cur==='excused'?'excused':''}" onclick="setStatus('${e.id}','${m.id}','excused')">E</button>
          </td>`;
        }).join('')}</tr>`).join('')}
        </tbody>
      </table></div>
      <div class="muted" style="margin-top:8px;">P = Present · A = Absent · E = Excused</div>`}
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between; align-items:center;">
        <h2 style="margin:0;">Participation Summary</h2>
        <button onclick="exportCSV()">Export CSV</button>
      </div>
      ${stats.length? `<div class="overflow"><table>
        <thead><tr><th>Member</th><th>Role</th><th>Present</th><th>Total Events</th><th>Rate</th></tr></thead>
        <tbody>
        ${stats.map(s=>`<tr><td>${esc(s.name)}</td><td><span class="role-tag">${esc(s.role||'Member')}</span></td><td>${s.present}</td><td>${s.total}</td><td class="pct ${pctClass(s.pct)}">${s.pct}%</td></tr>`).join('')}
        </tbody>
      </table></div>` : '<div class="empty">No data yet.</div>'}
    </div>

    <div class="card">
      <h2>Attendance Rate by Member</h2>
      ${stats.length? stats.slice().sort((a,b)=>b.pct-a.pct).map(s=>`
        <div class="bar-row">
          <div class="bar-label" title="${esc(s.name)}">${esc(s.name)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${s.pct}%; background:${s.pct>=80?'var(--ok)':s.pct>=50?'var(--warn)':'var(--bad)'};"></div></div>
          <div class="bar-val">${s.pct}%</div>
        </div>
      `).join('') : '<div class="empty">No data yet.</div>'}
    </div>
  `;
}

function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function addMember(){
  const input = document.getElementById('mName');
  const roleEl = document.getElementById('mRole');
  const name = input.value.trim();
  if(!name || !db) return;
  await db.collection('members').add({ name, role: roleEl.value, division: state.division });
  input.value='';
}

let downloadsApi = null;
async function exportCSV(){
  const div = state.division;
  const members = state.members.filter(m=>m.division===div);
  const events = state.events.filter(e=>e.division===div);
  const att = state.attendance.filter(a=>a.division===div);
  const rows = [['Name','Role','Present','Total Events','Rate (%)']];
  members.forEach(m=>{
    const present = att.filter(a=>a.memberId===m.id && a.status==='present').length;
    const total = events.length;
    const pct = total>0 ? Math.round((present/total)*100) : 0;
    rows.push([m.name, m.role||'Member', present, total, pct]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  try{
    if(!downloadsApi) downloadsApi = await claude.use('downloads');
    if(!downloadsApi){ alert('Export is unavailable in this view.'); return; }
    await downloadsApi.save({ filename: `SAIL_${div.replace(/[^a-z0-9]+/gi,'_')}_participation.csv`, data: csv });
  }catch(e){
    console.error(e);
  }
}
async function removeMember(id){
  if(!db) return;
  await db.doc('members/'+id).delete();
}
async function addEvent(){
  const nameEl = document.getElementById('eName');
  const dateEl = document.getElementById('eDate');
  const title = nameEl.value.trim();
  if(!title || !db) return;
  await db.collection('events').add({ title, date: dateEl.value||'', division: state.division });
  nameEl.value=''; dateEl.value='';
}
async function removeEvent(id){
  if(!db) return;
  await db.doc('events/'+id).delete();
}
async function setStatus(eventId, memberId, status){
  if(!db) return;
  const div = state.division;
  const id = eventId+'_'+memberId;
  const existing = state.attendance.find(a=>a.id===id);
  const next = (existing && existing.status===status) ? null : status; // toggle off
  if(next===null){
    await db.doc('attendance/'+id).delete();
  } else {
    await db.doc('attendance/'+id).set({ eventId, memberId, division: div, status: next });
  }
}

async function init(){
  try{
    db = await claude.use('db');
  }catch(e){ db = null; }
  render();
  if(!db){
    document.getElementById('main').insertAdjacentHTML('afterbegin',
      '<div class="card"><span class="muted">Live sync unavailable in this view — data will not be saved.</span></div>');
    return;
  }
  const bind = (colName, key) => {
    const unsub = db.collection(colName).onSnapshot(snap=>{
      state[key] = snap.docs.map(d=>({ id: d.id, ...d.data() }));
      render();
    }, err=>{ console.error(colName, err); });
    unsubs.push(unsub);
  };
  bind('members','members');
  bind('events','events');
  bind('attendance','attendance');
}
init();
</script>
</body>
</html>
